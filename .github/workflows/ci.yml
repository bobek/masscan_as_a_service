name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

      - name: Console script is wired up
        run: uv run masscan_as_a_service --help

  readme:
    # README.md is generated from README.jinja2.md + the argparse definitions,
    # so it must be regenerated whenever the CLI changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: README.md is up to date
        run: |
          uv run ./generate_readme.py > /tmp/README.md
          diff -u README.md /tmp/README.md \
            || { echo "::error::README.md is stale - run 'make README.md' and commit the result"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # We don't want to upload artifacts at this moment
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: dist
      #     path: dist/
