[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expressions
build-backend = "hatchling.build"

[project]
name = "masscan-as-a-service"
version = "0.0.1"
description = "Wrapper around masscan to perform regular scans for opened ports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Antonin Kral", email = "a.kral@bobek.cz" },
]
maintainers = [
    { name = "Antonin Kral", email = "a.kral@bobek.cz" },
]
keywords = ["masscan", "portscan", "security", "hetzner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fabric",
    "hcloud",
    "PyYAML",
    "pytz",
    "scp",
]

[project.optional-dependencies]
dev = [
    "jinja2",
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/bobek/masscan_as_a_service"
Repository = "https://github.com/bobek/masscan_as_a_service"
Issues = "https://github.com/bobek/masscan_as_a_service/issues"

[project.scripts]
masscan_as_a_service = "masscan_as_a_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/masscan_as_a_service"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/README.md",
    "/AUTHORS",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

[tool.ruff.format]
quote-style = "preserve"
